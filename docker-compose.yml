name: englishtech-frontend

services:
  frontend:
    image: node:20-alpine
    container_name: englishtech-frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5174}:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PORT: ${VITE_PORT:-5174}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://host.docker.internal:8080}
      VITE_APP_NAME: ${VITE_APP_NAME:-EnglishTech}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontend_node_modules:
